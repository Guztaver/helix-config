#:schema ./schemas/helix-languages.schema.json

[[language]]
name = "java"
language-servers = ["jdtls"]
auto-format = true
indent = { tab-width = 4, unit = "    " }

[language-server.jdtls]
timeout = 120
command = "C:\\tools\\bin\\jdtls.cmd"

[language-server.jdtls.config.java.inlayHints]
parameterNames.enabled = "all"

[[language]]
name = "toml"
language-servers = ["taplo"]
auto-format = true

[[language]]
name = "lua"
language-servers = ["lua-language-server"]

[language-server.lua-language-server]
command = "C:/Users/Gustavo/scoop/shims/lua-language-server.exe"

[language-server.lua-language-server.config.Lua]
runtime.version = "Lua 5.4"
workspace.checkThirdParty = false
workspace.library = [
  "C:/Users/Gustavo/.config/wezterm/wezterm-types/lua",
  "C:/Users/Gustavo/.config/wezterm/wezterm-session-manager",
]
completion.enable = true
